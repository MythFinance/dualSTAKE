name: Build and hash

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Build contract
        run: |
          ./build-and-hash.sh
      
      - name: Read hashes and create tag
        id: create_tag
        run: |
          PAGE1_HASH=$(cat artifacts/hashes/approval.teal.tok.page1.sha512-256)
          PAGE2_HASH=$(cat artifacts/hashes/approval.teal.tok.page2.sha512-256)
          TAG_NAME="contract-${PAGE1_HASH}-${PAGE2_HASH}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Tag will be: ${TAG_NAME}"
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit artifacts
        run: |
          git add -f artifacts/
          git diff --cached --quiet || git commit -m "Build artifacts and hashes for ${{ steps.create_tag.outputs.tag_name }}"
      
      - name: Create and push tag
        run: |
          git tag -f "${{ steps.create_tag.outputs.tag_name }}"
          git push -f origin "${{ steps.create_tag.outputs.tag_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Push commit
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
